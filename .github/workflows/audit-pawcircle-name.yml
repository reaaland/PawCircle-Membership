name: Refine PawCircle Membership public name

on:
  push:
    branches:
      - fix/full-site-name-loader
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine wording and preserve deployed webhook source
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/components/LogInModal.jsx'): {
                  'Log in to access your PawCircle Membership member account.':
                  'Log in to access your PawCircle Membership account.',
              },
              Path('src/components/ProviderPreview.jsx'): {
                  'do not represent actual PawCircle Membership members.':
                  'do not represent actual members of PawCircle Membership.',
              },
              Path('supabase/functions/send-account-deletion-request/index.ts'): {
                  'A signed-in PawCircle Membership member submitted an account and data deletion request.':
                  'A signed-in member of PawCircle Membership submitted an account and data deletion request.',
              },
              Path('supabase/functions/stripe-webhook/index.ts'): {
                  'No PawCircle Membership mapping found for price:':
                  'No PawCircle membership mapping found for price:',
              },
          }

          changed = []
          for path, pairs in replacements.items():
              original = path.read_text(encoding='utf-8')
              text = original
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f'Expected wording not found in {path}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('CHANGED_FILES')
          for item in changed:
              print(item)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Verify final wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('src'), Path('supabase/functions')]
          files = [Path('index.html')]
          for root in roots:
              files.extend(
                  p for p in root.rglob('*')
                  if p.is_file() and p.suffix.lower() in {'.js', '.jsx', '.ts', '.tsx', '.html'}
              )

          failures = []
          # The lowercase technical Stripe log and User-Agent are intentional exceptions.
          short_name = re.compile(r'PawCircle(?! Membership| LLC|/1\.0| membership mapping)')
          forbidden = [
              'PawCircle Membership Membership',
              'PawCircle Membership member account',
              'actual PawCircle Membership members',
              'signed-in PawCircle Membership member',
          ]

          for path in sorted(set(files)):
              text = path.read_text(encoding='utf-8')
              for number, line in enumerate(text.splitlines(), 1):
                  if short_name.search(line):
                      failures.append(f'{path}:{number}: {line.strip()}')
                  for phrase in forbidden:
                      if phrase in line:
                          failures.append(f'{path}:{number}: {line.strip()}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit('Final brand-name verification failed')

          print('Full-name wording and technical exceptions verified.')
          PY
      - name: Commit refined correction
        run: |
          git config user.name "Rebecca Aaland"
          git config user.email "reaaland@gmail.com"
          git add src supabase/functions
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "fix: refine PawCircle Membership wording [skip ci]"
          git push
